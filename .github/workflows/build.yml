name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'
          cache: true

      # 1. خطوة التنظيف الشامل
      - name: Clean project
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -f pubspec.lock

      # 2. إنشاء مجلد أندرويد
      - name: Create Android folder
        run: flutter create --project-name personal_assistant . --platforms=android

      # 3. جلب التبعيات
      - name: Get dependencies
        run: flutter pub get

      # 4. محاولة إصلاح أخطاء الكود تلقائياً
      - name: Auto-fix Dart code
        run: dart fix --apply

      # 5. محاولة البناء (سيطبع السبب الحقيقي إذا فشل)
      - name: Build APK
        run: flutter build apk --release --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: masaadi-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
              
